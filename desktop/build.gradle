plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'dev.vibebridge'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls', 'javafx.graphics', 'javafx.web']
}

application {
    mainClass = 'vbdesk.Main'
}

// Produces a native Windows installer (.exe) via jpackage.
// On Windows runners this creates desktop/build/jpackage/VibeBridge-1.0.0.exe
run {
    jvmArgs = [
        '--add-opens', 'javafx.web/javafx.scene.web=ALL-UNNAMED',
        '--add-opens', 'javafx.web/com.sun.webkit=ALL-UNNAMED'
    ]
}