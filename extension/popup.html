<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:360px;max-height:580px;overflow-y:auto;font:13px/1.5 -apple-system,"Segoe UI",Inter,sans-serif;background:linear-gradient(160deg,#171025 0%,#0e0a16 55%,#12081f 100%);color:#ece4f6;padding:16px;scrollbar-width:thin;scrollbar-color:#4a3a6a transparent}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#7b5aa6,#4f8df7);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;box-shadow:0 4px 14px rgba(123,90,166,.4)}
h1{font-size:14px;letter-spacing:1.5px;color:#fff;font-weight:700}
.sub{font-size:10px;color:#8f7fa8;letter-spacing:.4px}
#state{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:#b6a6c9;background:rgba(123,90,166,.12);border:1px solid rgba(123,90,166,.3);border-radius:999px;padding:4px 10px;margin-bottom:8px}
#state::before{content:"";width:7px;height:7px;border-radius:50%;background:#8f7fa8;box-shadow:0 0 6px #8f7fa8}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10.5px;color:#b6a6c9;background:rgba(123,90,166,.1);border:1px solid rgba(123,90,166,.25);border-radius:8px;padding:4px 8px;margin-bottom:6px}
.wrow button{padding:2px 8px;font-size:10px;margin:0}
pre#preview{background:rgba(10,6,18,.7);border:1px solid #2c2140;border-radius:10px;padding:10px;max-height:120px;overflow:auto;white-space:pre-wrap;font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#77688c;margin-bottom:4px}
.readonly{font-size:9.5px;color:#5f5478;margin-bottom:10px}
.blk{margin:0 0 8px;border:1px solid #2c2140;border-radius:10px;padding:8px;background:rgba(123,90,166,.06)}
.blk:hover{border-color:#4a3a6a}
.blk .bt{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:#8f7fa8;margin-bottom:4px}
.blk pre{max-height:80px;margin:0 0 6px;background:rgba(10,6,18,.7);border-radius:8px;padding:8px;white-space:pre-wrap;font:10.5px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#9a8fb0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
button{border:1px solid rgba(123,90,166,.45);border-radius:9px;padding:8px 10px;font-size:11.5px;font-weight:600;cursor:pointer;color:#efe6ff;background:linear-gradient(135deg,#2a1b45,#1d1230);transition:filter .15s,transform .1s}
button:hover{filter:brightness(1.3)}
button:active{transform:scale(.97)}
button.primary{background:linear-gradient(135deg,#7b5aa6,#5d3f85);border-color:transparent;box-shadow:0 4px 14px rgba(123,90,166,.35)}
.panel{border:1px solid #2c2140;border-radius:10px;padding:10px;margin-top:10px;background:rgba(10,6,18,.5)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;font-size:11px;color:#b6a6c9}
.switch{position:relative;width:34px;height:18px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:999px;background:#2c2140;transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#8f7fa8;transition:.2s}
.switch input:checked+span{background:#4a3a6a}
.switch input:checked+span::after{left:18px;background:#c9b3e8}
input[type=range]{width:100%;accent-color:#7b5aa6}
.lab{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:#8f7fa8;margin:8px 0 4px}
footer{margin-top:12px;font-size:9.5px;color:#5f5478;text-align:center;letter-spacing:.4px}
</style>
</head>
<body>
<header>
  <div class="logo">VS</div>
  <div>
    <h1>VIBE SENTINEL</h1>
    <div class="sub">generation watchdog · code-blocks-only handoff</div>
  </div>
</header>
<div id="state">checking…</div>
<div id="watched"></div>
<pre id="preview">no reply captured yet</pre>
<div class="readonly">read-only preview · only code blocks can be copied or sent</div>
<div id="blocks"></div>
<div class="grid">
  <button id="copy" class="primary">Copy code blocks</button>
  <button id="bridge" class="primary">Send blocks to Bridge</button>
  <button id="grab">Re-grab tab</button>
  <button id="inject">Watch this tab</button>
</div>
<div class="panel">
  <div class="row"><span>ping on completion</span><label class="switch"><input type="checkbox" id="sound" checked><span></span></label></div>
  <div class="row"><span>auto-send blocks to bridge</span><label class="switch"><input type="checkbox" id="autosend" checked><span></span></label></div>
  <div class="lab">silence threshold · <span id="sv">3.5</span>s</div>
  <input id="silence" type="range" min="1500" max="9000" step="500" value="3500">
</div>
<footer>v1.9 · local-only · zero servers · blocks-only</footer>
<script src="popup.js"></script>
</body>
</html>
