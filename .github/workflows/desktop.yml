name: desktop
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: build install dist
        run: gradle installDist --no-daemon

      - name: package app-image with jpackage
        run: >
          jpackage --type app-image
          --name VibeBridge
          --vendor VibeBridge
          --dest build/jpackage
          --input build/install/vibebridge-desktop/lib
          --main-jar vibebridge-desktop-1.0.0.jar
          --main-class vbdesk.Launcher

      - uses: actions/upload-artifact@v4
        with:
          name: VibeBridge-Desktop-Windows
          path: desktop/build/jpackage/**
          retention-days: 30