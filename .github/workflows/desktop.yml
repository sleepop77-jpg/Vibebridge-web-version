name: desktop
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: build distributable
        run: gradle createDistributable --no-daemon

      - name: package with jpackage
        run: gradle jpackage --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VibeBridge-Desktop-Windows
          path: |
            desktop/build/jpackage/**
            desktop/build/distributions/**
          if-no-files-found: warn
          retention-days: 30