<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeBridge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="sb">
  <div class="sbhead"><canvas id="sbbunny" width="30" height="36"></canvas><span>VIBEBRIDGE</span></div>
  <button id="newchat" class="sidebtn">+ NEW CHAT</button>
  <div class="sbsec">CONNECT</div>
  <input id="pat" type="password" placeholder="github_pat_…">
  <input id="repo" placeholder="owner/repo">
  <input id="branch" placeholder="main" value="main">
  <button id="connect" class="green full">CONNECT</button>
  <div id="connstatus" class="dim small">not connected</div>
  <label class="chk"><input type="checkbox" id="remember" checked> remember on this device</label>
  <label class="chk"><input type="checkbox" id="strict"> strict: require sentinel</label>
  <div class="sbfoot">web-native vibebridge<br>same engine as the phone app<br>docs/ rebuilds itself from chat 🐰</div>
</aside>
<div id="main">
  <header>
    <button id="sbtoggle" class="iconbtn">☰</button>
    <div class="modelwrap">
      <button id="modelbtn" class="modelbtn">VibeBridge • QWEN STUDIO ▾</button>
      <div id="modelmenu" class="menu hidden">
        <button data-m="QWEN STUDIO">QWEN STUDIO <span>bridge-tuned</span></button>
        <button data-m="CHATGPT">CHATGPT <span>no fences</span></button>
        <button data-m="GEMINI">GEMINI <span>small hunks</span></button>
      </div>
    </div>
  </header>
  <div id="chat">
    <div id="empty">
      <canvas id="bunny" width="60" height="72"></canvas>
      <div class="wordmark">VIBE<span>BRIDGE</span></div>
      <div id="tip" class="tip"></div>
      <div id="chips"></div>
    </div>
    <div id="flow"></div>
  </div>
  <div id="composerwrap">
    <div id="composer">
      <textarea id="input" rows="1" placeholder="Message VibeBridge…"></textarea>
      <div class="crow">
        <button id="paste" class="pill">PASTE</button>
        <div class="modelwrap">
          <button id="tplbtn" class="pill">TEMPLATES ▾</button>
          <div id="tplmenu" class="menu hidden"></div>
        </div>
        <span class="spacer"></span>
        <button id="send" class="sendbtn">↑</button>
      </div>
    </div>
    <div class="footnote">VibeBridge web • payloads parse locally • tokens stay in this tab</div>
  </div>
</div>
<script src="github.js"></script>
<script src="app.js"></script>
</body>
</html>
