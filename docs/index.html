<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeBridge // Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal">
        <header class="term-header">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="title">vibe-bridge — zsh — 80x24</span>
        </header>
        
        <div class="term-body" id="output">
            <div class="line system">VibeBridge If-Then Engine v1.0</div>
            <div class="line system">Type 'help' for commands. Paste payloads to load rules.</div>
            <div class="line system">----------------------------------------</div>
        </div>

        <div class="term-input-area">
            <span class="prompt">user@vibebridge:~$</span>
            <input type="text" id="input" autocomplete="off" spellcheck="false" autofocus>
        </div>
    </div>

    <script src="github.js"></script>
    <script src="app.js"></script>
</body>
</html>
